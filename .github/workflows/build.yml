name: Build and Release

on:
  push:
    # Claude Generated 2026 - same scheme as curcuma's ccpp.yml: main publishes the
    # nightly prerelease; every feature/** and fix/** branch publishes its own
    # ci-<branch> prerelease, so branch builds never overwrite the nightly assets.
    # A branch outside that naming scheme has to be added here (or run by hand).
    branches: [ main, "feature/**", "fix/**" ]
    # Documentation-only commits cannot change the binaries; the consequence is
    # that a markdown-only push does not refresh the release assets.
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  # Any branch can be built and published on demand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            artifact_name: qurcuma-linux-x86_64.AppImage
          - name: windows
            os: windows-latest
            artifact_name: qurcuma-windows.zip
            cpack_generator: ZIP
          - name: macos
            os: macos-latest
            artifact_name: qurcuma-macos.zip
            cpack_generator: ZIP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Claude Generated 2026 - bumped from 6.6.3: src/dialogs/nmrspectrumdialog.cpp
          # uses QCheckBox::checkStateChanged, added in Qt 6.7 (replacing the
          # tristate-unsafe stateChanged(int)); 6.6.3 failed with "not a member of
          # QCheckBox". Matches the Qt version used in local development (6.11.x).
          version: "6.8.2"
          modules: qtquick3d qtcharts qtshadertools
          cache: true

      # Claude Generated 2026 - main.cpp probes Vulkan via QVulkanInstance before
      # falling back to OpenGL. Without the system Vulkan headers, Qt's own
      # QVulkanInstance stays an incomplete type ("Could NOT find WrapVulkanHeaders"
      # at Configure) and `QVulkanInstance vk;` fails to compile.
      - name: Install Vulkan headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      # Claude Generated 2026 - Apple Clang ships no OpenMP runtime/headers at all
      # (`omp.h` not found building gfnff_method.cpp); Homebrew's libomp is keg-only
      # (not on default include/lib paths), so point CMake's find_package(OpenMP) at it.
      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OPENMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DOpenMP_ROOT=$OPENMP_ROOT' || '' }}

      - name: Build
        # Claude Generated 2026 - explicit job count: unbounded --parallel on the
        # standard Linux runner OOM-kills cc1plus partway through (heavy Eigen/-O3
        # TUs in curcuma_core/curcuma_cap run multiple GCC instances out of RAM).
        run: cmake --build build --config Release --parallel 2

      # ---------- Linux: AppImage ----------
      - name: Install Linux deployment deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 patchelf desktop-file-utils

      - name: Build AppImage (linuxdeploy + Qt plugin)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p tools AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

          # 1) Binary finden (ggf. Namen unten anpassen)
          APP_BIN="$(find build -type f -executable -name 'qurcuma*' | head -n1)"
          if [ -z "${APP_BIN}" ]; then
            echo "Kein ausführbares qurcuma-Binary in build/ gefunden."
            exit 1
          fi
          cp "${APP_BIN}" AppDir/usr/bin/qurcuma

          # 2) Desktop-Datei (ggf. Exec/Icon anpassen)
          cat > AppDir/usr/share/applications/qurcuma.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Qurcuma
          Exec=qurcuma
          Icon=qurcuma
          Categories=Education;Science;Chemistry;
          EOF

          # 3) Icon kopieren (Pfad ggf. anpassen)
          ICON_SRC="$(find . -type f \( -iname 'qurcuma.png' -o -iname '*icon*.png' \) | head -n1 || true)"
          if [ -n "${ICON_SRC}" ]; then
            cp "${ICON_SRC}" AppDir/usr/share/icons/hicolor/256x256/apps/qurcuma.png
          else
            # Fallback: leeres Placeholder-Icon vermeiden -> minimal
            convert -size 256x256 xc:transparent AppDir/usr/share/icons/hicolor/256x256/apps/qurcuma.png || true
          fi

          # 4) linuxdeploy + plugin holen
          curl -L -o tools/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o tools/linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -L -o tools/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x tools/linuxdeploy tools/linuxdeploy-plugin-qt tools/appimagetool

          # AppImage entpackt ausführen (robuster in CI)
          export ARCH=x86_64
          export QML_SOURCES_PATHS="${GITHUB_WORKSPACE}"
          ./tools/linuxdeploy --appdir AppDir --desktop-file AppDir/usr/share/applications/qurcuma.desktop --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/qurcuma.png --plugin qt --output appimage

          OUT="$(ls -1 ./*.AppImage | head -n1)"
          mv "${OUT}" "${{ matrix.artifact_name }}"

      # ---------- Windows/macOS: ZIP via CPack ----------
      - name: Package with CPack
        if: runner.os != 'Linux'
        run: |
          cpack --config build/CPackConfig.cmake -G ${{ matrix.cpack_generator }}

      - name: Prepare artifact (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          pkg=$(ls -1 *.zip 2>/dev/null | head -n1)
          if [ -z "$pkg" ]; then
            echo "No .zip package produced by CPack"
            exit 1
          fi
          mv "$pkg" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish prerelease
    runs-on: ubuntu-latest
    needs: build
    # Claude Generated 2026 - by default a failing matrix entry (e.g. Windows,
    # which has known unported portability issues) would skip this job entirely
    # even though Linux/macOS built successfully. Publish whatever artifacts did
    # get produced instead of blocking the whole release on one platform.
    # Pull requests build but never publish.
    if: ${{ github.event_name != 'pull_request' && !cancelled() }}

    steps:
      # Claude Generated 2026 - the tag push below needs a git directory.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Claude Generated 2026 - main keeps its fixed "nightly" prerelease; any other
      # branch gets one prerelease per branch whose tag follows the branch head.
      # The asset names carry no run number, so each run replaces the previous
      # assets of its release instead of piling up next to them.
      - name: Compute release identity
        id: rel
        run: |
          set -eu
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "name=Nightly Build" >> "$GITHUB_OUTPUT"
            echo "version=nightly" >> "$GITHUB_OUTPUT"
          else
            slug="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
            echo "tag=ci-${slug}" >> "$GITHUB_OUTPUT"
            echo "name=Qurcuma CI (${GITHUB_REF_NAME})" >> "$GITHUB_OUTPUT"
            echo "version=ci-${slug}" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the release tag to this commit
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.rel.outputs.tag }}" "${GITHUB_SHA}"
          git push origin "refs/tags/${{ steps.rel.outputs.tag }}" --force

      - name: Name the assets after the release
        run: |
          set -eu
          mkdir -p upload
          v="${{ steps.rel.outputs.version }}"
          if [ -f dist/linux/qurcuma-linux-x86_64.AppImage ]; then
            cp dist/linux/qurcuma-linux-x86_64.AppImage "upload/qurcuma-${v}-linux-x86_64.AppImage"
          fi
          if [ -f dist/windows/qurcuma-windows.zip ]; then
            cp dist/windows/qurcuma-windows.zip "upload/qurcuma-${v}-windows.zip"
          fi
          if [ -f dist/macos/qurcuma-macos.zip ]; then
            cp dist/macos/qurcuma-macos.zip "upload/qurcuma-${v}-macos.zip"
          fi
          ls -l upload

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: upload/*
          body: |
            Automated build from `${{ github.ref_name }}`.
            - Repository: ${{ github.repository }}
            - Commit: ${{ github.sha }}
            - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          append_body: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
